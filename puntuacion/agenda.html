<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #D69C9C;">
  <div class="container mt-4">

    <div class="p-3" style="background-color: #F3DDD1;">
      <div class="p-2 text-white" style="background-color: #7B0F45;">
        <h2>Ejercicio 3</h2>
      </div>

      <table class="table table-bordered mt-2">
        <tr>
          <th>Día</th>
          <th>Hr</th>
          <th>Evento</th>
          <th>Desc.</th>
        </tr>
        <tbody id="tabla"></tbody>
      </table>

      Día
      <select id="dia" class="form-select">
        <option value="0">Lunes</option>
        <option value="1">Martes</option>
        <option value="2">Miércoles</option>
        <option value="3">Jueves</option>
        <option value="4">Viernes</option>
        <option value="5">Sábado</option>
        <option value="6">Domingo</option>
      </select>

      Hr
      <input type="time" id="hora" class="form-control">

      Evento
      <input type="text" id="evento" class="form-control">

      Desc.
      <textarea id="desc" class="form-control"></textarea>

      <button class="btn text-white mt-2" style="background-color: #A8627C;" onclick="guardar()">Guardar</button>
      <br>
      <a href="index.html">Regresar</a>
    </div>

  </div>

  <script src="a.js"></script>
</body>
</html>
