<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #D69C9C;">
  <div class="container mt-4">

    <div class="p-3" style="background-color: #F3DDD1;">
      <div class="p-2 text-white" style="background-color: #7B0F45;">
        <h2>Ejercicio 2</h2>
      </div>

      <table class="table table-bordered mt-2">
        <tr>
          <th>Puesto</th>
          <th>Nuevo</th>
          <th>Jr</th>
          <th>Sr</th>
        </tr>
        <tr>
          <td>Diseñador</td>
          <td>120</td>
          <td>180</td>
          <td>280</td>
        </tr>
        <tr>
          <td>Programador</td>
          <td>120</td>
          <td>210</td>
          <td>340</td>
        </tr>
        <tr>
          <td>Líder</td>
          <td>240</td>
          <td>520</td>
          <td>890</td>
        </tr>
      </table>

      Puesto
      <select id="puesto" class="form-select">
        <option value="0">Diseñador</option>
        <option value="1">Programador</option>
        <option value="2">Líder</option>
      </select>

      Nivel
      <select id="nivel" class="form-select">
        <option value="0">Nuevo</option>
        <option value="1">Jr</option>
        <option value="2">Sr</option>
      </select>

      Hrs
      <input type="number" id="horas" class="form-control" value="40">

      <button class="btn text-white mt-2" style="background-color: #A8627C;" onclick="calcular()">Calcular</button>
      <p>Total: $<span id="total"></span></p>
      <a href="index.html">Regresar</a>
    </div>

  </div>

  <script src="puestos.js"></script>
</body>
</html>
